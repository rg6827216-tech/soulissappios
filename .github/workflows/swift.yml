# This workflow builds and tests the iOS app workspace with Xcode

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        DESTINATION_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((d["udid"] for runtime in devices.values() for d in runtime if d.get("isAvailable") and d.get("name", "").startswith("iPhone")), ""))')
        if [ -z "$DESTINATION_ID" ]; then
          echo "No available iOS iPhone simulator found"
          exit 1
        fi
        echo "DESTINATION_ID=$DESTINATION_ID" >> "$GITHUB_ENV"
        xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -destination "id=$DESTINATION_ID" build
    - name: Run tests
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -destination "id=$DESTINATION_ID" test
