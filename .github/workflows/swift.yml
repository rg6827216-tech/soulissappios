# This workflow builds and tests the iOS app workspace with Xcode

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -destination 'generic/platform=iOS Simulator' build
    - name: Run tests
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' test
