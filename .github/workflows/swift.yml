# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Select iOS Simulator
      run: |
        SIMULATOR_UDID=$(python3 - <<'PY'
        import json
        import subprocess

        devices = json.loads(subprocess.check_output([
            "xcrun", "simctl", "list", "devices", "available", "--json"
        ]))

        for runtime, runtime_devices in devices["devices"].items():
            if "iOS" not in runtime:
                continue
            for device in runtime_devices:
                if device.get("isAvailable") and device["name"].startswith("iPhone"):
                    print(device["udid"])
                    raise SystemExit(0)

        raise SystemExit("No available iOS simulator found")
        PY
        )
        echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
    - name: Build
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -sdk iphonesimulator -destination "id=$SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO build-for-testing
    - name: Run tests
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -sdk iphonesimulator -destination "id=$SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO test-without-building
