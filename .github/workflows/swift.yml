# This workflow builds and tests the iOS app workspace with Xcode

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        DESTINATION_ID=$(xcrun simctl list devices available --json | python3 .github/scripts/select_ios_simulator_udid.py)
        if [ -z "$DESTINATION_ID" ]; then
          echo "No available iOS iPhone simulator found"
          exit 1
        fi
        echo "DESTINATION_ID=$DESTINATION_ID" >> "$GITHUB_ENV"
        xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -configuration Release -sdk iphonesimulator -destination "id=$DESTINATION_ID" build
    - name: Run tests
      run: |
        if [ -z "$DESTINATION_ID" ]; then
          echo "No simulator destination configured"
          exit 1
        fi
        xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -configuration Release -sdk iphonesimulator -destination "id=$DESTINATION_ID" test
