# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
    - name: Run tests
      run: xcodebuild -workspace soulissappios.xcworkspace -scheme soulissappios -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO test
